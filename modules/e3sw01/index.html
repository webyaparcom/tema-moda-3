<div id="sw2Root" class="sw2-widget" data-sw2-count="0">
  <button type="button" class="sw2-trigger" aria-haspopup="true" aria-expanded="false" aria-label="{{cartTitle}}">
    <span class="sw2-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1.4"></circle>
        <circle cx="18" cy="21" r="1.4"></circle>
        <path d="M2.5 3h2.4l2.3 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6l1.6-8.4H6.2"></path>
      </svg>
    </span>
    <span class="sw2-badge" data-sw2-badge>0</span>
  </button>

  <div class="sw2-overlay" data-sw2-overlay hidden></div>

  <div class="sw2-dropdown" data-sw2-dropdown hidden>
    <div class="sw2-header">
      <span class="sw2-title">{{cartTitle}}</span>
      <button type="button" class="sw2-close" data-sw2-close aria-label="{{closeText}}">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>

    <div class="sw2-body" data-sw2-body>
      <div class="sw2-empty" data-sw2-empty>
        <span class="sw2-empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1.4"></circle>
            <circle cx="18" cy="21" r="1.4"></circle>
            <path d="M2.5 3h2.4l2.3 12.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 2-1.6l1.6-8.4H6.2"></path>
          </svg>
        </span>
        <p class="sw2-empty-text">{{emptyText}}</p>
      </div>

      <ul class="sw2-list" data-sw2-list></ul>

      <template data-sw2-item-template>
        <li class="sw2-item" data-sw2-item>
          <div class="sw2-item-img" data-sw2-item-img></div>
          <div class="sw2-item-info">
            <span class="sw2-item-name" data-sw2-item-name></span>
            <span class="sw2-item-price" data-sw2-item-price></span>
            <div class="sw2-item-qty">
              <button type="button" class="sw2-qty-btn sw2-qty-minus" data-sw2-qty-minus aria-label="{{decreaseText}}">-</button>
              <span class="sw2-qty-value" data-sw2-qty-value></span>
              <button type="button" class="sw2-qty-btn sw2-qty-plus" data-sw2-qty-plus aria-label="{{increaseText}}">+</button>
            </div>
          </div>
          <button type="button" class="sw2-item-remove" data-sw2-item-remove aria-label="{{removeText}}">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 6"></path>
            </svg>
          </button>
        </li>
      </template>
    </div>

    <div class="sw2-footer" data-sw2-footer>
      <div class="sw2-total">
        <span class="sw2-total-label">{{totalText}}</span>
        <span class="sw2-total-value" data-sw2-total-value>0</span>
      </div>
      <button type="button" class="sw2-checkout-btn" data-sw2-checkout>{{goCartText}}</button>
    </div>
  </div>

  <style>
    #sw2Root {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    #sw2Root .sw2-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: 1px solid var(--et-border);
      border-radius: var(--et-radius-sm);
      background: var(--et-bg-elevated);
      color: var(--et-text);
      cursor: pointer;
      transition: var(--et-transition);
    }

    #sw2Root .sw2-trigger:hover {
      background: var(--et-bg-hover);
      border-color: var(--et-primary);
      color: var(--et-primary);
    }

    #sw2Root .sw2-icon {
      display: inline-flex;
    }

    #sw2Root .sw2-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      border-radius: 999px;
      background: var(--et-badge-bg);
      color: var(--et-badge-text);
      transition: var(--et-transition);
    }

    #sw2Root .sw2-badge:empty,
    #sw2Root[data-sw2-count="0"] .sw2-badge {
      opacity: 0;
      transform: scale(0.6);
    }

    #sw2Root .sw2-overlay {
      position: fixed;
      inset: 0;
      background: var(--et-overlay-bg);
      z-index: 998;
      animation: sw2FadeIn var(--et-transition-fast) ease;
    }

    #sw2Root .sw2-dropdown {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 340px;
      max-width: 92vw;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
      background: var(--et-bg-elevated);
      border: 1px solid var(--et-border);
      border-radius: var(--et-radius);
      box-shadow: var(--et-shadow);
      z-index: 999;
      overflow: hidden;
      animation: sw2SlideDown var(--et-transition) ease;
      transform-origin: top right;
    }

    #sw2Root .sw2-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--et-border);
    }

    #sw2Root .sw2-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--et-text);
    }

    #sw2Root .sw2-close {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--et-text-muted);
      cursor: pointer;
      border-radius: var(--et-radius-sm);
      transition: var(--et-transition-fast);
    }

    #sw2Root .sw2-close:hover {
      background: var(--et-bg-hover);
      color: var(--et-text);
    }

    #sw2Root .sw2-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #sw2Root .sw2-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 40px 20px;
      color: var(--et-text-muted);
      text-align: center;
    }

    #sw2Root .sw2-empty-icon {
      color: var(--et-text-muted);
      opacity: 0.6;
    }

    #sw2Root .sw2-empty-text {
      font-size: 13px;
      margin: 0;
    }

    #sw2Root .sw2-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    #sw2Root .sw2-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--et-border);
      animation: sw2FadeIn var(--et-transition-fast) ease;
    }

    #sw2Root .sw2-item:last-child {
      border-bottom: none;
    }

    #sw2Root .sw2-item-img {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: var(--et-radius-sm);
      background-color: var(--et-bg-hover);
      background-size: cover;
      background-position: center;
    }

    #sw2Root .sw2-item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #sw2Root .sw2-item-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--et-text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #sw2Root .sw2-item-price {
      font-size: 12px;
      font-weight: 700;
      color: var(--et-price-color);
    }

    #sw2Root .sw2-item-qty {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    #sw2Root .sw2-qty-btn {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--et-border);
      border-radius: var(--et-radius-sm);
      background: var(--et-bg-elevated);
      color: var(--et-text);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      transition: var(--et-transition-fast);
    }

    #sw2Root .sw2-qty-btn:hover {
      border-color: var(--et-primary);
      color: var(--et-primary);
    }

    #sw2Root .sw2-qty-value {
      min-width: 16px;
      text-align: center;
      font-size: 12px;
      color: var(--et-text);
    }

    #sw2Root .sw2-item-remove {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--et-text-muted);
      cursor: pointer;
      border-radius: var(--et-radius-sm);
      transition: var(--et-transition-fast);
    }

    #sw2Root .sw2-item-remove:hover {
      background: var(--et-danger-bg);
      color: var(--et-danger);
    }

    #sw2Root .sw2-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--et-border);
      background: var(--et-bg-elevated);
    }

    #sw2Root .sw2-total {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    #sw2Root .sw2-total-label {
      font-size: 13px;
      color: var(--et-text-muted);
    }

    #sw2Root .sw2-total-value {
      font-size: 16px;
      font-weight: 700;
      color: var(--et-price-color);
    }

    #sw2Root .sw2-checkout-btn {
      width: 100%;
      padding: 11px 16px;
      border: none;
      border-radius: var(--et-radius-sm);
      background: var(--et-primary);
      color: var(--et-on-primary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: var(--et-transition-fast);
    }

    #sw2Root .sw2-checkout-btn:hover {
      background: var(--et-primary-hover);
    }

    @keyframes sw2SlideDown {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes sw2FadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 480px) {
      #sw2Root .sw2-dropdown {
        position: fixed;
        top: auto;
        bottom: 0;
        right: 0;
        left: 0;
        width: 100%;
        max-width: 100%;
        max-height: 80vh;
        border-radius: var(--et-radius) var(--et-radius) 0 0;
        animation: sw2SlideUpMobile var(--et-transition) ease;
      }
    }

    @keyframes sw2SlideUpMobile {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    
  
  /* P18 a11y focus-visible (sw2-dropdown) */
  .sw2-trigger:focus-visible,
  .sw2-dropdown button:focus-visible,
  .sw2-dropdown a:focus-visible,
  .sw2-qty-btn:focus-visible,
  .sw2-item-remove:focus-visible,
  [data-sw2-close]:focus-visible,
  [data-sw2-checkout]:focus-visible {
    outline: 3px solid var(--mx-et-clay-warm, #C97B4A);
    outline-offset: 2px;
  }
@media (prefers-reduced-motion: reduce) {
      #sw2Root .sw2-dropdown,
      #sw2Root .sw2-overlay,
      #sw2Root .sw2-item,
      #sw2Root .sw2-badge,
      #sw2Root .sw2-trigger,
      #sw2Root .sw2-qty-btn,
      #sw2Root .sw2-item-remove,
      #sw2Root .sw2-checkout-btn {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</div>
